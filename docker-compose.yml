version: "3.9"
services:
  gemini-proxy:
    container_name: gemini-proxyyy
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_PORT}:5000"
    env_file:
      - .env
    environment:
      APP_PORT: 5000
    volumes:
      - ./admin/data:/app/admin/data
      - ./data_rooms:/app/data_rooms
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
  pinggy:
    image: alpine
    container_name: gemini-tunnel
    restart: unless-stopped
    depends_on:
      - gemini-proxy
    command: sh -c "apk add --no-cache openssh-client && ([ -f /root/.ssh/id_ed25519 ] || ssh-keygen -t ed25519 -N '' -f /root/.ssh/id_ed25519) && ssh -o StrictHostKeyChecking=no -R proxis:80:gemini-proxy:5000 localhost.run"
