<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}RP{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
    :root{
        --bg: #0b1220;
        --card: #0f1724;
        --muted: #9ca3af;
        --accent: #4f46e5; /* indigo */
        --accent-2: #06b6d4; /* cyan */
        --bubble-user: #2563eb;
        --bubble-other: #111827;
        --bubble-assistant: #1f2937;
        --text: #e6eef8;
    }
    *{box-sizing:border-box}
    body{
        margin:0;
        background:linear-gradient(180deg, rgba(9,10,14,1) 0%, rgba(15,18,36,1) 100%);
        color:var(--text);
        font-family: 'Inter', Arial, sans-serif;
        -webkit-font-smoothing:antialiased;
        -moz-osx-font-smoothing:grayscale;
    }
    .rp-page{
        max-width:960px;
        margin:28px auto;
        padding:16px;
    }
    .rp-card{
        background: linear-gradient(180deg, rgba(17,24,39,0.85), rgba(15,23,42,0.9));
        border-radius:12px;
        padding:20px;
        box-shadow: 0 6px 24px rgba(2,6,23,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.03);
    }
    h1{font-weight:600;color:var(--text);}
    .muted{color:var(--muted)}

    /* Message area */
    #messages{
        height:480px;
        overflow-y:auto;
        background:linear-gradient(180deg, rgba(2,6,23,0.2), rgba(2,6,23,0));
        border-radius:12px;
        padding:18px;
        margin-bottom:14px;
        border:1px solid rgba(255,255,255,0.03);
        display:flex;flex-direction:column;gap:10px;
    }
    .msg-row{display:flex;gap:12px;align-items:flex-end}
    .msg-row.right{flex-direction:row-reverse}
    .avatar{
        width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;font-weight:600;color:#041124;background:linear-gradient(135deg,var(--accent),var(--accent-2));flex:0 0 40px
    }
    .bubble{
        max-width:78%;padding:10px 14px;border-radius:12px;color:var(--text);white-space:pre-wrap;line-height:1.4;font-size:0.95rem;box-shadow: 0 4px 10px rgba(2,6,23,0.6);
    }
    .bubble.user{background:linear-gradient(180deg,var(--bubble-user), #1e40af);border-bottom-right-radius:6px}
    .bubble.other{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.02)}
    .bubble.assistant{background:linear-gradient(180deg,var(--bubble-assistant), #111827);border:1px solid rgba(255,255,255,0.02)}
    .meta{font-size:0.75rem;color:var(--muted);margin-bottom:6px}

    /* Input */
    #message-form{display:flex;gap:8px;align-items:center}
    #message-input{flex:1;background:transparent;border:1px solid rgba(255,255,255,0.06);padding:10px 12px;border-radius:10px;color:var(--text);}
    #message-input:focus{outline:none;box-shadow:0 0 0 3px rgba(79,70,229,0.12);border-color:var(--accent)}
    #send-btn{min-width:110px}

    /* Participants */
    #participants{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .participant{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:999px;background:rgba(255,255,255,0.02);font-size:0.9rem}
    .participant .p-avatar{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-weight:600;background:rgba(255,255,255,0.04)}

    /* Invite link */
    .invite{display:flex;gap:8px;align-items:center}
    .invite code{background:transparent;color:var(--accent-2);padding:6px;border-radius:8px;border:1px dashed rgba(255,255,255,0.03)}

    /* Banners */
    .alert{border-radius:10px}

    @media (max-width:720px){
        .rp-page{margin:12px}
        #messages{height:380px}
    }
</style>
</head>
<body>
<div class="rp-page">
    {% block content %}{% endblock %}
</div>
</body>
</html>
