<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Proxi RP{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        :root {
            --bg-dark: #0b0c10;
            --bg-card: rgba(22, 24, 33, 0.75);
            --bg-input: #151722;
            --border-color: rgba(255, 255, 255, 0.08);
            
            --accent-purple: #9d4edd;
            --accent-purple-hover: #b15eff;
            --accent-glow: rgba(157, 78, 221, 0.3);
            --gradient-purple: linear-gradient(135deg, #7b2cbf 0%, #9d4edd 100%);

            --text-main: #f1f3f9;
            --text-muted: #8c92b0;
            
            --user-msg: #211936;
            --user-border: rgba(157, 78, 221, 0.35);
            --bot-msg: #171923;
            --bot-border: rgba(255, 255, 255, 0.07);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 50% -20%, #201035 0%, var(--bg-dark) 70%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* Glassmorphism Card Style */
        .rp-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .form-control, .form-select {
            background-color: var(--bg-input) !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-main) !important;
            border-radius: 12px;
            padding: 12px 16px;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--accent-purple) !important;
            box-shadow: 0 0 12px var(--accent-glow) !important;
        }

        .form-label {
            color: var(--text-muted);
            font-size: 0.88rem;
            font-weight: 500;
            margin-bottom: 6px;
        }

        /* Gradient Buttons */
        .btn-purple {
            background: var(--gradient-purple);
            border: none;
            color: #fff;
            font-weight: 600;
            border-radius: 12px;
            padding: 12px 24px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn-purple:hover {
            color: #fff;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(157, 78, 221, 0.45);
        }

        .btn-outline-custom {
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            transition: all 0.2s ease;
        }

        .btn-outline-custom:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border-color: var(--accent-purple);
        }

        /* Range Slider */
        input[type=range]::-webkit-slider-thumb {
            background: var(--accent-purple);
        }

        /* Navbar */
        .rp-navbar {
            background: rgba(11, 12, 16, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar rp-navbar px-3 py-2">
        <div class="container-fluid max-width-1200">
            <a class="navbar-brand d-flex align-items-center gap-2 text-white fw-bold" href="/rp/new">
                <span class="d-inline-flex align-items-center justify-content-center bg-purple text-white rounded-3 fs-6" style="width:34px; height:34px; background:var(--gradient-purple);">
                    <i class="bi bi-controller"></i>
                </span>
                Proxi RP
            </a>
            {% block nav_actions %}{% endblock %}
        </div>
    </nav>

    <main class="flex-grow-1 d-flex flex-column">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
