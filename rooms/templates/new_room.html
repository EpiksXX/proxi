{% extends "rp_base.html" %}

{% block title %}Создать ролевую комнату — Proxi RP{% endblock %}

{% block content %}
<div class="container py-5 d-flex justify-content-center align-items-center flex-grow-1">
    <div class="rp-card p-4 p-md-5 w-100" style="max-width: 650px;">
        <h3 class="fw-bold mb-1">Создание ролевой комнаты</h3>
        <p class="text-muted mb-4">Задайте характер ИИ и параметры сессии для пошаговой игры.</p>

        <form action="/rp/new" method="POST" class="d-flex flex-column gap-3">
            <div>
                <label class="form-label">Имя ИИ / Персонажа</label>
                <input type="text" name="character_name" class="form-control" placeholder="Например: Магистр Элион" required autofocus>
            </div>

            <div>
                <label class="form-label">Системный промпт (Характер и правила)</label>
                <textarea name="system_prompt" class="form-control" rows="4" placeholder="Опишите поведение ИИ, сеттинг игры и его реакцию на действия игроков..." required></textarea>
            </div>

            <div>
                <label class="form-label">API Ключ Gemini (Опционально)</label>
                <input type="password" name="api_key" class="form-control" placeholder="Оставьте пустым для использования ключа сервера">
            </div>

            <div class="row g-3">
                <div class="col-6">
                    <label class="form-label">Температура (<span id="temp-val">1.0</span>)</label>
                    <input type="range" name="temperature" class="form-range" min="0" max="2" step="0.1" value="1.0" oninput="document.getElementById('temp-val').innerText = this.value">
                </div>
                <div class="col-6">
                    <label class="form-label">Макс. токенов</label>
                    <input type="number" name="max_tokens" class="form-control" value="2000">
                </div>
            </div>

            <button type="submit" class="btn btn-purple w-100 mt-3">
                <i class="bi bi-plus-circle me-2"></i> Создать комнату
            </button>
        </form>
    </div>
</div>
{% endblock %}
