<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Gemini Proxy{% endblock %}</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('admin.static', filename='css/style.css') }}">

    <style>
        :root {
            --bg-dark: #0b0d14;
            --sidebar-bg: #111420;
            --card-bg: #161926;
            --card-hover: #1c2030;
            --accent-purple: #a855f7;
            --accent-gradient: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-dark) !important;
            color: #f1f5f9 !important;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
        }

        .admin-wrapper {
            min-height: 100vh;
            height: auto !important;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            min-width: 260px;
            background: var(--sidebar-bg) !important;
            border-right: 1px solid var(--border-color) !important;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .sidebar .brand-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            padding: 0 12px 20px 12px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sidebar-menu a {
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 12px;
            padding: 10px 16px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-menu a:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
            transform: translateX(3px);
        }

        .sidebar-menu a.active {
            color: #ffffff;
            background: var(--accent-gradient);
            box-shadow: 0 4px 18px rgba(168, 85, 247, 0.35);
        }

        .sidebar-menu .disabled {
            color: #475569;
            padding: 10px 16px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0.6;
            cursor: not-allowed;
            user-select: none;
        }

        /* Main Content Area — естественный поток без растягивания */
        .content {
            flex-grow: 1;
            display: block !important;
            padding: 24px 32px !important;
            height: auto !important;
            min-height: 0 !important;
            min-width: 0;
        }

        .content > .container-fluid,
        .content .lorebooks-list {
            height: auto !important;
            min-height: 0 !important;
            display: block !important;
        }

        .content .d-flex {
            height: auto !important;
        }

        /* Global UI Elements */
        .lorebook-card {
            background: var(--card-bg) !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 14px !important;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            margin-bottom: 12px;
        }

        .lorebook-card:hover {
            border-color: rgba(168, 85, 247, 0.35) !important;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4) !important;
            background: var(--card-hover) !important;
        }

        .tag-badge {
            background: rgba(168, 85, 247, 0.12) !important;
            color: #c084fc !important;
            border: 1px solid rgba(168, 85, 247, 0.3) !important;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            padding: 6px 12px;
            border-radius: 8px;
        }

        .btn-purple {
            background: var(--accent-gradient) !important;
            color: #ffffff !important;
            border: none !important;
            border-radius: 10px !important;
            padding: 8px 18px !important;
            font-weight: 600 !important;
            height: 38px !important;
            max-height: 38px !important;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3) !important;
            transition: all 0.2s ease !important;
        }

        .btn-purple:hover {
            box-shadow: 0 6px 22px rgba(168, 85, 247, 0.45) !important;
            transform: translateY(-1px);
            color: #ffffff !important;
        }

        .btn-outline-custom {
            background: rgba(255, 255, 255, 0.04) !important;
            color: #e2e8f0 !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 10px !important;
            padding: 8px 16px !important;
            font-weight: 500 !important;
            height: 38px !important;
            max-height: 38px !important;
            transition: all 0.2s ease !important;
        }

        .btn-outline-custom:hover {
            background: rgba(255, 255, 255, 0.08) !important;
            color: #ffffff !important;
            border-color: rgba(255, 255, 255, 0.2) !important;
        }

        @media (max-width: 768px) {
            .admin-wrapper {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                min-width: 100%;
                min-height: auto;
            }
            .content {
                padding: 16px !important;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
<div class="d-flex admin-wrapper">
    <aside class="sidebar">
        <div class="brand-title">
            <i class="bi bi-cpu-fill" style="color: var(--accent-purple);"></i>
            <span>Gemini Proxy</span>
        </div>
        <ul class="sidebar-menu">
            <li>
                <a href="{{ url_for('admin.dashboard') }}" class="{% if request.endpoint == 'admin.dashboard' %}active{% endif %}">
                    <i class="bi bi-speedometer2"></i> Dashboard
                </a>
            </li>
            <li>
                <a href="{{ url_for('admin.lorebooks_list') }}" class="{% if request.endpoint == 'admin.lorebooks_list' %}active{% endif %}">
                    <i class="bi bi-journal-bookmark"></i> Lorebooks
                </a>
            </li>
            <li>
                <a href="{{ url_for('admin.plugins_list') }}" class="{% if request.endpoint == 'admin.plugins_list' %}active{% endif %}">
                    <i class="bi bi-puzzle"></i> Plugins
                </a>
            </li>
            <li class="disabled"><i class="bi bi-cpu"></i> Memory</li>
            <li class="disabled"><i class="bi bi-file-earmark-text"></i> Logs</li>
            <li class="disabled"><i class="bi bi-gear"></i> Settings</li>
        </ul>
    </aside>

    <main class="content">
        {% block content %}{% endblock %}
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('admin.static', filename='js/app.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
