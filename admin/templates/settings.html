{% extends "base.html" %}

{% block title %}Settings — Gemini Proxy{% endblock %}

{% block content %}
<div class="container-fluid p-3">
    <h4 class="fw-bold mb-3 text-light"><i class="bi bi-gear" style="color: var(--accent-purple);"></i> Settings</h4>
    <div class="lorebook-card p-4">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label text-light">Глобальный API-ключ Gemini по умолчанию:</label>
                <input type="password" class="form-control custom-input" name="default_api_key" placeholder="AIzaSy...">
            </div>
            <button type="submit" class="btn btn-purple btn-sm">Сохранить параметры</button>
        </form>
    </div>
</div>
{% endblock %}
