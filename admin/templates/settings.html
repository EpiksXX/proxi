{% extends "base.html" %}

{% block title %}Settings — Gemini Proxy{% endblock %}

{% block content %}
<div class="container-fluid p-3">
    <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom border-secondary-subtle">
        <h4 class="fw-bold m-0 text-light d-flex align-items-center gap-2">
            <i class="bi bi-gear-fill" style="color: var(--accent-purple);"></i>
            <span>Настройки Прокси</span>
        </h4>
    </div>

    {% if saved %}
    <div class="alert alert-success bg-success bg-opacity-20 text-success border-success border-opacity-20 mb-3 py-2">
        <i class="bi bi-check-circle me-1"></i> Настройки успешно сохранены!
    </div>
    {% endif %}

    <div class="lorebook-card p-4" style="max-width: 700px;">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label text-light fw-medium">Глобальный API-ключ Gemini по умолчанию:</label>
                <input type="password" class="form-control custom-input" name="default_api_key" value="{{ settings.default_api_key }}" placeholder="AIzaSy...">
                <small class="text-muted d-block mt-1">Используется, если в комнате не задан индивидуальный ключ.</small>
            </div>

            <div class="mb-3">
                <label class="form-label text-light fw-medium">Модель по умолчанию:</label>
                <select class="form-select custom-input" name="default_model">
                    <option value="gemini-3-flash-preview" {% if settings.default_model == 'gemini-3-flash-preview' %}selected{% endif %}>Gemini 3 Flash Preview (Быстрая / Новая)</option>
                    <option value="gemini-2.5-flash" {% if settings.default_model == 'gemini-2.5-flash' %}selected{% endif %}>Gemini 2.5 Flash</option>
                    <option value="gemini-2.5-pro" {% if settings.default_model == 'gemini-2.5-pro' %}selected{% endif %}>Gemini 2.5 Pro (Умная)</option>
                </select>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label text-light fw-medium">Температура (Креативность):</label>
                    <input type="number" step="0.1" min="0" max="2" class="form-control custom-input" name="temperature" value="{{ settings.temperature }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label text-light fw-medium">Максимум токенов в ответе:</label>
                    <input type="number" class="form-control custom-input" name="max_tokens" value="{{ settings.max_tokens }}">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-light fw-medium">Фильтр цензуры (Safety Settings):</label>
                <select class="form-select custom-input" name="safety_level">
                    <option value="BLOCK_NONE" {% if settings.safety_level == 'BLOCK_NONE' %}selected{% endif %}>Отключен (BLOCK_NONE — Рекомендуется для RP)</option>
                    <option value="BLOCK_ONLY_HIGH" {% if settings.safety_level == 'BLOCK_ONLY_HIGH' %}selected{% endif %}>Низкий (Минимальная цензура)</option>
                    <option value="BLOCK_MEDIUM_AND_ABOVE" {% if settings.safety_level == 'BLOCK_MEDIUM_AND_ABOVE' %}selected{% endif %}>Стандартный (Средний)</option>
                </select>
            </div>

            <button type="submit" class="btn btn-purple btn-sm">
                <i class="bi bi-save me-1"></i> Сохранить настройки
            </button>
        </form>
    </div>
</div>
{% endblock %}
